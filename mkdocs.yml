site_name: Project Documentation Knowledge Base
site_url: https://example.com
site_description: Demo project documentation knowledge base with an MCP developer agent bridge
repo_url: https://example.com/doc-kb
copyright: Copyright &copy; 2025 doc-kb demo

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - toc.integrate

nav:
  - Home: index.md
  - Modules:
      - Auth: modules/auth/index.md
  - ADRs:
      - '0001 Use Qdrant': adr/0001-use-qdrant.md
  - Specs:
      - Overview: specs/overview.md
      - Ingest Pipeline: specs/ingest-pipeline.md
  - Runbooks:
      - Rebuild Index: runbooks/rebuild-index.md
      - Query MCP: runbooks/query-mcp.md

plugins:
  - search:
      lang: en
      separator: '[\s\-,]+'

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite:
      style_plain_text: true
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
